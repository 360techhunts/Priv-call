<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Private Call</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .video-wrapper { flex: 1; position: relative; background: #111; width: 100%; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #1c1c1e; }
        #localVideo { 
            position: absolute; top: 20px; right: 20px; width: 100px; height: 150px; 
            object-fit: cover; border-radius: 12px; border: 2px solid #fff; z-index: 10; transform: scaleX(-1);
            background: #000;
        }
        .status-hud {
            position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 8px 16px;
            border-radius: 20px; font-size: 13px; font-weight: 600; border: 1px solid rgba(255,255,255,0.2); z-index: 30;
        }
        .controls-overlay { 
            position: absolute; bottom: 40px; left: 0; right: 0; display: flex; 
            flex-direction: column; align-items: center; z-index: 20; padding: 0 20px;
        }
        .menu-box {
            background: rgba(28, 28, 30, 0.95); padding: 24px; border-radius: 20px;
            width: 100%; max-width: 340px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        button { 
            background: #34c759; color: white; border: none; padding: 16px; font-size: 16px; 
            font-weight: 600; border-radius: 12px; width: 100%; cursor: pointer; transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        .link-box {
            background: #222; padding: 12px; border-radius: 8px; margin-top: 15px;
            font-family: monospace; font-size: 13px; color: #34c759; word-break: break-all;
            border: 1px dashed #555; display: none; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <div id="statusHUD" class="status-hud" style="color: #ffcc00;">Requesting Camera...</div>
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
        
        <div class="controls-overlay">
            <div id="menu" class="menu-box">
                <h3 style="margin-bottom: 15px; font-size: 18px;">Instant P2P Call</h3>
                <p style="font-size: 14px; color: #8e8e93; margin-bottom: 20px;" id="menu-desc">Create a secure, one-time link.</p>
                
                <button id="action-btn">Create Call Link</button>
                <div id="link-box" class="link-box"></div>
            </div>
        </div>
    </div>

    <script>
        let localStream, peer, activeCall;
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusHUD = document.getElementById('statusHUD');
        const menu = document.getElementById('menu');
        const actionBtn = document.getElementById('action-btn');
        const linkBox = document.getElementById('link-box');

        // Check if user is clicking an invite link
        const urlParams = new URLSearchParams(window.location.search);
        const joinRoomId = urlParams.get('room');

        const rtcConfig = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayprojectsecret' }
            ] 
        };

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                localVideo.srcObject = localStream;
                
                if (joinRoomId) {
                    startJoinerFlow();
                } else {
                    statusHUD.innerText = "Ready to Create";
                    statusHUD.style.color = "#fff";
                }
            } catch (err) {
                alert("Camera and microphone access is required.");
                statusHUD.innerText = "Camera Blocked";
                statusHUD.style.color = "#ff3b30";
            }
        }

        // --- HOST FLOW ---
        actionBtn.onclick = () => {
            if (joinRoomId) return; // Prevent clicking if in joiner mode
            
            actionBtn.innerText = "Generating...";
            actionBtn.disabled = true;

            // Create a random, unguessable room ID
            const randomRoomId = 'room_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            peer = new Peer(randomRoomId, { config: rtcConfig });

            peer.on('open', (id) => {
                // Create the shareable URL
                const inviteUrl = window.location.origin + window.location.pathname + '?room=' + id;
                
                actionBtn.style.display = 'none';
                document.getElementById('menu-desc').innerText = "Send this link to your friend. It will expire once they join.";
                
                linkBox.style.display = 'block';
                linkBox.innerText = inviteUrl + "\n\n(Tap to Copy Link)";
                
                linkBox.onclick = () => {
                    navigator.clipboard.writeText(inviteUrl);
                    linkBox.style.color = "#fff";
                    linkBox.innerText = "✅ Link Copied! Send it now.";
                };

                statusHUD.innerText = "Waiting for connection...";
                statusHUD.style.color = "#ffcc00";
            });

            peer.on('call', (call) => {
                // THE SINGLE-USE TRICK: Disconnect from the signaling server immediately!
                // The WebRTC video will keep working, but the room is destroyed.
                peer.disconnect(); 
                
                call.answer(localStream);
                activeCall = call;
                menu.style.display = 'none';

                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    statusHUD.innerText = "Securely Connected";
                    statusHUD.style.color = "#34c759";
                });

                call.on('close', endCall);
            });
        };

        // --- JOINER FLOW ---
        function startJoinerFlow() {
            menu.style.display = 'none'; // Hide the menu completely
            statusHUD.innerText = "Connecting to Host...";
            statusHUD.style.color = "#ffcc00";

            peer = new Peer(null, { config: rtcConfig });

            peer.on('open', () => {
                const call = peer.call(joinRoomId, localStream);
                
                if (!call) {
                    showError("Link Expired or Invalid.");
                    return;
                }

                activeCall = call;

                call.on('stream', (remoteStream) => {
                    remoteVideo.srcObject = remoteStream;
                    statusHUD.innerText = "Securely Connected";
                    statusHUD.style.color = "#34c759";
                });

                call.on('close', endCall);
            });

            peer.on('error', (err) => {
                showError("Link Expired! The host has either left or someone else used this link.");
            });
        }

        function showError(msg) {
            statusHUD.innerText = "Connection Failed";
            statusHUD.style.color = "#ff3b30";
            menu.style.display = 'block';
            menu.innerHTML = `<h3 style='color:#ff3b30'>${msg}</h3><br><button onclick='window.location.href=window.location.origin+window.location.pathname'>Create Your Own Call</button>`;
        }

        function endCall() {
            remoteVideo.srcObject = null;
            statusHUD.innerText = "Call Ended";
            statusHUD.style.color = "#ff3b30";
            setTimeout(() => window.location.href = window.location.origin + window.location.pathname, 2000);
        }

        // Boot up
        init();
    </script>
</body>
</html>
