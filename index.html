<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private P2P Call Rooms</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .video-wrapper { flex: 1; position: relative; background: #111; width: 100%; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #1c1c1e; }
        #localVideo { 
            position: absolute; top: 20px; right: 20px; width: 100px; height: 150px; 
            object-fit: cover; border-radius: 12px; border: 2px solid #fff; z-index: 10; transform: scaleX(-1);
        }
        .status-hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); padding: 8px 16px;
            border-radius: 20px; font-size: 13px; font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2); z-index: 30; color: #ffcc00;
        }
        .controls-overlay { 
            position: absolute; bottom: 30px; left: 0; right: 0; display: flex; 
            flex-direction: column; align-items: center; gap: 15px; padding: 0 20px; z-index: 20; 
        }
        .menu-box {
            background: rgba(28, 28, 30, 0.95); padding: 20px; border-radius: 20px;
            width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        button { 
            background: #34c759; color: white; border: none; padding: 14px; font-size: 16px; 
            font-weight: 600; border-radius: 12px; width: 100%; cursor: pointer;
        }
        button.secondary { background: #007aff; }
        input {
            width: 100%; background: #2c2c2e; border: 1px solid rgba(255,255,255,0.2);
            padding: 12px; border-radius: 10px; color: #fff; font-size: 15px; text-align: center;
        }
        #info-box { font-size: 14px; text-align: center; color: #34c759; margin-top: 5px; line-height: 1.4;}
    </style>
</head>
<body>

    <div class="video-wrapper">
        <div id="statusHUD" class="status-hud">Initializing Permissions...</div>
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
        
        <div class="controls-overlay">
            <div id="menu" class="menu-box">
                <input type="password" id="roomPass" placeholder="Set/Enter Room Password">
                <button id="create-btn">1. Create New Call Room</button>
                <div style="text-align: center; color: #8e8e93; font-size: 12px; margin: 4px 0;">— OR JOIN EXISTING —</div>
                <input type="number" id="joinPIN" placeholder="Enter 6-Digit Room PIN">
                <button id="join-btn" class="secondary">2. Join Call Room</button>
                <div id="info-box" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream, myPeer, currentCall;
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusHUD = document.getElementById('statusHUD');
        const infoBox = document.getElementById('infoBox');

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                localVideo.srcObject = localStream;
                
                myPeer = new Peer(undefined, {
                    host: window.location.hostname,
                    port: window.location.port || (window.location.protocol === 'https:' ? 443 : 80),
                    path: '/peerjs',
                    secure: window.location.protocol === 'https:'
                });

                myPeer.on('open', (id) => {
                    statusHUD.innerText = "System Ready";
                    statusHUD.style.color = "#34c759";
                });

                myPeer.on('call', (call) => {
                    currentCall = call;
                    call.answer(localStream);
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream;
                        statusHUD.innerText = "In Call (Connected)";
                        statusHUD.style.color = "#34c759";
                    });
                });

            } catch (err) {
                alert("Camera and microphone permission popups must be accepted.");
            }
        }

        // Creator Flow
        document.getElementById('create-btn').onclick = () => {
            const password = document.getElementById('roomPass').value.trim();
            if (!password) { alert("Please type a room password first!"); return; }

            // Generate an easily readable 6-digit PIN number
            const generatedPIN = Math.floor(100000 + Math.random() * 900000).toString();
            
            document.getElementById('create-btn').style.display = 'none';
            document.getElementById('join-btn').style.display = 'none';
            document.getElementById('joinPIN').style.display = 'none';
            
            const display = document.getElementById('info-box');
            display.innerHTML = `<strong>Room Ready!</strong><br>Tell your friend to open the web link and enter:<br><br>PIN: <span style='font-size:18px;color:#fff;'>${generatedPIN}</span><br>Password: <span style='font-size:18px;color:#fff;'>${password}</span>`;
            display.style.display = 'block';
            
            statusHUD.innerText = "Waiting for friend to enter PIN...";
            statusHUD.style.color = "#ffcc00";

            socket.emit('create-room', { roomId: generatedPIN, password: password, peerId: myPeer.id });
        };

        // Joiner Flow
        document.getElementById('join-btn').onclick = () => {
            const password = document.getElementById('roomPass').value.trim();
            const pin = document.getElementById('joinPIN').value.trim();
            
            if (!password || !pin) { alert("Please enter both the Password and the 6-Digit PIN!"); return; }

            document.getElementById('menu').style.display = 'none';
            statusHUD.innerText = "Verifying PIN Credentials...";
            
            socket.emit('join-room', { roomId: pin, password: password, peerId: myPeer.id });
        };

        socket.on('peer-status-change', (data) => {
            if (data.connected) {
                document.getElementById('menu').style.display = 'none';
                statusHUD.innerText = "Connecting Streams...";
                
                if (!data.isCreator) {
                    const call = myPeer.call(data.targetPeerId, localStream);
                    currentCall = call;
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream;
                        statusHUD.innerText = "In Call (Connected)";
                    });
                }
            } 
        });

        socket.on('peer-disconnected', () => {
            remoteVideo.srcObject = null;
            statusHUD.innerText = "Call ended / Link Expired";
            statusHUD.style.color = "#ff3b30";
            alert('The other person left. This room and PIN are now permanently destroyed.');
            window.location.href = window.location.origin;
        });

        socket.on('auth-error', (msg) => { alert(msg); window.location.reload(); });
        socket.on('room-error', (msg) => { alert(msg); window.location.href = window.location.origin; });

        init();
    </script>
</body>
</html>
