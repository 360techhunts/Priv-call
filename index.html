<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Peer-to-Peer Calling</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .video-wrapper { flex: 1; position: relative; background: #111; width: 100%; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #1c1c1e; }
        #localVideo { 
            position: absolute; top: 20px; right: 20px; width: 100px; height: 150px; 
            object-fit: cover; border-radius: 12px; border: 2px solid #fff; z-index: 10; transform: scaleX(-1);
        }
        .status-hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); padding: 8px 16px;
            border-radius: 20px; font-size: 13px; font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2); z-index: 30; color: #ffcc00;
        }
        .controls-overlay { 
            position: absolute; bottom: 30px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 15px; padding: 0 20px; z-index: 20; 
        }
        button { 
            background: #34c759; color: white; border: none; padding: 16px 32px; font-size: 16px; font-weight: 600; border-radius: 30px; width: 100%; max-width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #link-display { 
            background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(10px); padding: 15px; border-radius: 14px; font-size: 14px; text-align: center; word-break: break-all; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 320px; color: #34c759;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <div id="statusHUD" class="status-hud">Connecting System...</div>
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="controls-overlay">
            <div id="setup"><button id="create-btn">Create Secure Link</button></div>
            <div id="link-display" style="display:none;"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let localStream, myPeer, currentCall;
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusHUD = document.getElementById('statusHUD');

        // Target exact URL parameters safely
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                localVideo.srcObject = localStream;
                
                // Initialize clean data pipeline on shared main server port
                myPeer = new Peer(undefined, {
                    host: window.location.hostname,
                    port: window.location.port || (window.location.protocol === 'https:' ? 443 : 80),
                    path: '/peerjs',
                    secure: window.location.protocol === 'https:'
                });

                myPeer.on('open', (id) => {
                    statusHUD.innerText = "System Ready";
                    statusHUD.style.color = "#34c759";

                    if (roomId) {
                        document.getElementById('setup').style.display = 'none';
                        const passcode = prompt("Enter the unique password provided by the link creator:");
                        statusHUD.innerText = "Verifying Invite Link...";
                        socket.emit('join-room', { roomId, password: passcode, peerId: id });
                    }
                });

                myPeer.on('call', (call) => {
                    currentCall = call;
                    call.answer(localStream);
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream;
                        statusHUD.innerText = "In Call (Connected)";
                        statusHUD.style.color = "#34c759";
                    });
                });

            } catch (err) {
                alert("Camera and microphone access permissions are mandatory.");
            }
        }

        document.getElementById('create-btn').onclick = () => {
            const customPassword = prompt("Set a unique password for this specific call:");
            if (!customPassword) { alert("A password is required!"); return; }

            roomId = Math.random().toString(36).substring(2, 11);
            
            // FIXED: Generates an accurate, un-truncated full browser address structure
            const inviteLink = window.location.origin + window.location.pathname + "?room=" + roomId;
            
            const display = document.getElementById('link-display');
            display.innerText = "Share link & password privately:\n\n" + inviteLink;
            display.style.display = 'block';
            document.getElementById('setup').style.display = 'none';

            navigator.clipboard.writeText(inviteLink);
            
            statusHUD.innerText = "Waiting for friend...";
            statusHUD.style.color = "#ffcc00";

            socket.emit('create-room', { roomId, password: customPassword, peerId: myPeer.id });
        };

        socket.on('peer-status-change', (data) => {
            if (data.connected) {
                statusHUD.innerText = "Friend Joined! Connecting Audio/Video...";
                statusHUD.style.color = "#34c759";
                
                // Only the joiner triggers the outbound call sequence to the creator
                if (!data.isCreator) {
                    const call = myPeer.call(data.targetPeerId, localStream);
                    currentCall = call;
                    call.on('stream', (remoteStream) => {
                        remoteVideo.srcObject = remoteStream;
                        statusHUD.innerText = "In Call (Connected)";
                    });
                }
            } else {
                remoteVideo.srcObject = null;
                statusHUD.innerText = "Call ended / Link Expired";
                statusHUD.style.color = "#ff3b30";
                alert('The other person disconnected. This single-use room is destroyed.');
                window.location.href = window.location.origin;
            }
        });

        socket.on('auth-error', (msg) => { alert(msg); window.location.reload(); });
        socket.on('room-error', (msg) => { alert(msg); window.location.href = window.location.origin; });

        init();
    </script>
</body>
</html>
