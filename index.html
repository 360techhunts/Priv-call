<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Peer Call</title>
    <!-- Managed WebRTC Signaling Client Engine -->
    <script src="https://jsdelivr.net"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }
        .video-wrapper { flex: 1; position: relative; background: #111; width: 100%; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #1c1c1e; }
        #localVideo { 
            position: absolute; top: 20px; right: 20px; width: 100px; height: 150px; 
            object-fit: cover; border-radius: 12px; border: 2px solid #fff; z-index: 10; transform: scaleX(-1);
        }
        .status-hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); padding: 8px 16px;
            border-radius: 20px; font-size: 13px; font-weight: 600;
            border: 1px solid rgba(255,255,255,0.2); z-index: 30; color: #ffcc00;
        }
        .controls-overlay { 
            position: absolute; bottom: 30px; left: 0; right: 0; display: flex; 
            flex-direction: column; align-items: center; gap: 15px; padding: 0 20px; z-index: 20; 
        }
        .menu-box {
            background: rgba(28, 28, 30, 0.95); padding: 20px; border-radius: 20px;
            width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        button { 
            background: #34c759; color: white; border: none; padding: 14px; font-size: 16px; 
            font-weight: 600; border-radius: 12px; width: 100%; cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        button.secondary { background: #007aff; }
        input {
            width: 100%; background: #2c2c2e; border: 1px solid rgba(255,255,255,0.2);
            padding: 12px; border-radius: 10px; color: #fff; font-size: 15px; text-align: center;
        }
        #info-box { font-size: 13px; text-align: left; color: #34c759; margin-top: 5px; line-height: 1.4; word-break: break-all;}
    </style>
</head>
<body>

    <div class="video-wrapper">
        <div id="statusHUD" class="status-hud">Connecting Media...</div>
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
        
        <div class="controls-overlay">
            <div id="menu" class="menu-box">
                <input type="password" id="roomPass" placeholder="Set Room Password">
                <button id="create-btn">1. Create One-Time Call</button>
                <div style="text-align: center; color: #8e8e93; font-size: 12px; margin: 4px 0;">— OR UNLOCK AN INVITE —</div>
                <input type="text" id="inviteToken" placeholder="Paste Private Token String">
                <button id="join-btn" class="secondary">2. Join Secure Call</button>
                <div id="info-box" style="display:none;"></div>
            </div>
        </div>
    </div>

    <script>
        let localStream, peerConnection, client, channel, isCreatorMode;
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusHUD = document.getElementById('statusHUD');
        const infoBox = document.getElementById('info-box');

        const rtcConfig = { 
            iceServers: [
                { urls: 'stun:://google.com' },
                { urls: 'turn:staticauth.openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayprojectsecret' }
            ] 
        };

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                localVideo.srcObject = localStream;
                
                // Initialize global signal cluster
                client = new MeteredRealtime.Client({ apiKey: "public_openrelay_project_key" });
                
                statusHUD.innerText = "System Ready";
                statusHUD.style.color = "#34c759";
            } catch (err) {
                alert("Camera and mic device permissions must be granted.");
            }
        }

        // 1. Creator Workflow
        document.getElementById('create-btn').onclick = () => {
            const password = document.getElementById('roomPass').value.trim();
            if (!password) { alert("Please set a room password first!"); return; }

            isCreatorMode = true;
            const generatedRoom = Math.random().toString(36).substring(2, 14);
            
            // Generate encrypted configuration packet instead of full site link
            const secureToken = btoa(JSON.stringify({ r: generatedRoom, p: password }));

            document.getElementById('create-btn').style.display = 'none';
            document.getElementById('join-btn').style.display = 'none';
            document.getElementById('inviteToken').style.display = 'none';
            document.getElementById('roomPass').style.display = 'none';
            
            infoBox.innerHTML = `<strong>Room Live!</strong><br>Send this raw text token to your friend:<br><br><span style='color:#fff;background:#222;padding:6px;display:block;border-radius:6px;'>${secureToken}</span>`;
            infoBox.style.display = 'block';
            
            statusHUD.innerText = "Waiting for friend...";
            statusHUD.style.color = "#ffcc00";

            navigator.clipboard.writeText(secureToken);
            connectToCluster(generatedRoom);
        };

        // 2. Joiner Workflow
        document.getElementById('join-btn').onclick = () => {
            const token = document.getElementById('inviteToken').value.trim();
            if (!token) { alert("Please paste the private invite token string!"); return; }

            try {
                isCreatorMode = false;
                const parsedData = JSON.parse(atob(token));
                
                document.getElementById('menu').style.display = 'none';
                statusHUD.innerText = "Verifying Token Integrity...";
                
                connectToCluster(parsedData.r);
            } catch(e) {
                alert("Invalid or broken token string!");
                window.location.reload();
            }
        };

        function connectToCluster(targetRoom) {
            channel = client.joinChannel(targetRoom);
            setupPeerConnection();

            // Direct event alerts when a friend enters the room
            channel.on("peer-joined", async () => {
                statusHUD.innerText = "Friend Connected! Syncing Feeds...";
                statusHUD.style.color = "#34c759";
                
                if (isCreatorMode) {
                    const offer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(offer);
                    channel.emit("signal", { sdp: offer });
                }
            });

            channel.on("signal", async (data) => {
                if (data.sdp) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
                    if (data.sdp.type === 'offer') {
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        channel.emit("signal", { sdp: answer });
                    }
                } else if (data.candidate) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
                    } catch(e) {}
                }
            });

            // Strict single-use lifecycle verification
            channel.on("peer-left", () => {
                remoteVideo.srcObject = null;
                statusHUD.innerText = "Expired / Wiped";
                statusHUD.style.color = "#ff3b30";
                alert('Call ended. This secure token has been permanently destroyed.');
                window.location.href = window.location.origin;
            });
        }

        function setupPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams;
                statusHUD.innerText = "In Call (Connected)";
                statusHUD.style.color = "#34c759";
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) channel.emit("signal", { candidate: event.candidate });
            };
        }

        init();
    </script>
</body>
</html>
