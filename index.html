<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Instant Private Call</title>
    
    <!-- 1. The WebRTC Universal Translator (Ensures Chrome talks perfectly to Safari/Firefox) -->
    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <!-- 2. PeerJS Library -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: #0a0a0c; color: #fff; 
            height: 100vh; /* Fallback for older browsers */
            height: 100dvh; /* Modern mobile dynamic height */
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        #secure-loading {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100%;
            background: #050505; z-index: 9999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #fff;
        }

        #app-container {
            position: relative; width: 100%; height: 100%; background: #111; overflow: hidden;
        }

        @media (min-width: 500px) {
            #app-container {
                width: 400px; height: 85vh; height: 85dvh; max-height: 850px; 
                border-radius: 40px; border: 8px solid #1c1c1e;
                box-shadow: 0 25px 60px rgba(0,0,0,0.8);
            }
        }

        .video-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #151515; }
        
        #localVideo { 
            position: absolute; top: 20px; right: 20px; width: 110px; height: 160px; 
            object-fit: cover; border-radius: 16px; border: 2px solid rgba(255,255,255,0.2); 
            z-index: 10; transform: scaleX(-1); background: #000; transition: 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        #localVideo.hidden { opacity: 0; pointer-events: none; transform: scaleX(-1) scale(0.8); }
        
        .status-hud {
            position: absolute; top: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 30px; 
            font-size: 13px; font-weight: 600; border: 1px solid rgba(255,255,255,0.15); 
            z-index: 30; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); 
            white-space: nowrap; transition: 0.3s;
        }

        .controls-overlay { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; z-index: 20; width: 85%;
        }
        .menu-box {
            background: rgba(28, 28, 30, 0.7); padding: 30px 24px; border-radius: 24px;
            width: 100%; text-align: center; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
        }
        button.primary-btn { 
            background: linear-gradient(135deg, #34c759, #2eb150); color: white; border: none; 
            padding: 16px; font-size: 16px; font-weight: 600; border-radius: 16px; width: 100%; 
            cursor: pointer; transition: 0.2s; box-shadow: 0 4px 15px rgba(52, 199, 89, 0.3);
        }
        button.primary-btn:active { transform: scale(0.96); }
        
        .link-box {
            background: rgba(0,0,0,0.4); padding: 16px; border-radius: 12px; margin-top: 20px;
            font-family: monospace; font-size: 13px; color: #34c759; word-break: break-all;
            border: 1px solid rgba(52,199,89,0.3); display: none; cursor: pointer; transition: 0.2s;
        }

        .call-controls-bar {
            position: absolute; bottom: 60px; 
            left: 50%; transform: translateX(-50%);
            display: flex; justify-content: space-between; gap: 8px; width: 92%; 
            background: transparent; padding: 0; z-index: 35;
        }
        .control-btn {
            flex: 1; background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.15); color: white;
            padding: 12px 0; border-radius: 20px; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; 
            align-items: center; gap: 4px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .control-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .control-btn.off { background: rgba(255, 159, 10, 0.9); color: #000; border: none; }
        .control-btn.end { background: rgba(255, 59, 48, 0.9); border: none; }
        
        .icon-container { position: relative; font-size: 18px; }
        #chatBadge {
            position: absolute; top: -4px; right: -8px; width: 12px; height: 12px;
            background: #ff3b30; border-radius: 50%; border: 2px solid #222; display: none;
        }

        #chatPopupOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.15); z-index: 45; display: flex; 
            justify-content: center; align-items: flex-end; padding-bottom: 12px; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #chatPopupOverlay.open { opacity: 1; pointer-events: auto; }

        #chatPanel {
            width: 94%; height: 60%; max-height: 450px;
            background: rgba(28, 28, 30, 0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 24px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.5);
            transform: translateY(120%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        #chatPopupOverlay.open #chatPanel { transform: translateY(0); }
        
        .chat-header {
            padding: 14px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 15px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
        .chat-close-btn { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; width: 30px; height: 30px; color: #fff; font-size: 16px; cursor: pointer; }
        
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
        .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.4; word-break: break-word; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .chat-bubble.local { background: rgba(10, 132, 255, 0.9); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-bubble.remote { background: rgba(60, 60, 62, 0.9); color: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
        
        .chat-input-bar { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid rgba(255, 255, 255, 0.1); background: transparent; }
        #chatInput { flex: 1; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 12px 16px; border-radius: 24px; font-size: 15px; outline: none; }
        #chatInput:focus { border-color: #0a84ff; background: rgba(0,0,0,0.7); }
        #sendBtn { background: rgba(52, 199, 89, 0.9); border: none; color: white; padding: 0 16px; border-radius: 24px; font-weight: 600; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="secure-loading">
        <div style="font-size: 22px; font-weight: 600; margin-bottom: 8px;" id="loading-title">Secure Connection</div>
        <div style="font-size: 14px; color: #888;" id="loading-subtitle">Initializing hardware...</div>
    </div>

    <div id="app-container">
        <div class="video-wrapper">
            <!-- Apple Safari compatibility tags added: webkit-playsinline -->
            <video id="remoteVideo" autoplay playsinline webkit-playsinline="true"></video>
            <video id="localVideo" autoplay playsinline webkit-playsinline="true" muted></video>
        </div>

        <div id="statusHUD" class="status-hud" style="color: #ffcc00;">Requesting Camera...</div>
        
        <div class="controls-overlay" id="mainOverlay">
            <div id="menu" class="menu-box">
                <h3 style="margin-bottom: 8px; font-size: 20px;">Instant Call</h3>
                <p style="font-size: 14px; color: #8e8e93; margin-bottom: 24px;" id="menu-desc">Secure, single-use connection.</p>
                <button id="action-btn" class="primary-btn">Create Secure Link</button>
                <div id="link-box" class="link-box"></div>
            </div>
        </div>

        <div class="call-controls-bar" id="mediaControls" style="display: none;">
            <button id="toggleAudioBtn" class="control-btn"><div class="icon-container">🎙</div> Mute</button>
            <button id="toggleVideoBtn" class="control-btn"><div class="icon-container">📷</div> Video</button>
            <button id="chatToggleBtn" class="control-btn"><div class="icon-container">💬<div id="chatBadge"></div></div> Chat</button>
            <button id="endCallBtn" class="control-btn end"><div class="icon-container">☎️</div> End</button>
        </div>

        <div id="chatPopupOverlay">
            <div id="chatPanel">
                <div class="chat-header">
                    <span>Encrypted Chat 🔒</span>
                    <button class="chat-close-btn" id="closeChatBtn">&times;</button>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-bar">
                    <input type="text" id="chatInput" placeholder="Message..." maxlength="500" autocomplete="off">
                    <button id="sendBtn">Send</button>
                </div>
            </div>
        </div>
    </div> 

    <script>
        let localStream, peer, activeCall, dataConn;
        let isAudioMuted = false, isVideoOff = false;
        let mediaConnected = false, dataConnected = false;

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const statusHUD = document.getElementById('statusHUD');
        const mainOverlay = document.getElementById('mainOverlay');
        const mediaControls = document.getElementById('mediaControls');
        const actionBtn = document.getElementById('action-btn');
        const linkBox = document.getElementById('link-box');
        const loadingScreen = document.getElementById('secure-loading');

        const toggleAudioBtn = document.getElementById('toggleAudioBtn');
        const toggleVideoBtn = document.getElementById('toggleVideoBtn');
        const endCallBtn = document.getElementById('endCallBtn');

        const chatToggleBtn = document.getElementById('chatToggleBtn');
        const chatBadge = document.getElementById('chatBadge');
        const chatPopupOverlay = document.getElementById('chatPopupOverlay');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');

        const urlParams = new URLSearchParams(window.location.search);
        const joinRoomId = urlParams.get('room');

        const rtcConfig = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayprojectsecret' }
            ] 
        };

        window.addEventListener('beforeunload', () => {
            if (activeCall) activeCall.close();
            if (dataConn) dataConn.close();
            if (peer) peer.destroy();
            shutOffHardware();
        });

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                localVideo.srcObject = localStream;
                mediaControls.style.display = 'flex';
                
                if (joinRoomId) {
                    document.getElementById('loading-subtitle').innerText = "Verifying secure link...";
                    startJoinerFlow();
                } else { 
                    loadingScreen.style.display = 'none';
                    statusHUD.innerText = "Ready to Create"; statusHUD.style.color = "#fff"; 
                }
            } catch (err) {
                document.getElementById('loading-title').innerText = "Access Denied";
                document.getElementById('loading-subtitle').innerText = "Camera and microphone are required to connect.";
                document.getElementById('loading-title').style.color = "#ff3b30";
            }
        }

        toggleAudioBtn.onclick = () => {
            const track = localStream.getAudioTracks()[0];
            if (track) {
                isAudioMuted = !isAudioMuted; track.enabled = !isAudioMuted;
                toggleAudioBtn.classList.toggle('off', isAudioMuted);
                toggleAudioBtn.innerHTML = isAudioMuted ? '<div class="icon-container">🔇</div> Muted' : '<div class="icon-container">🎙</div> Mute';
            }
        };

        toggleVideoBtn.onclick = () => {
            const track = localStream.getVideoTracks()[0];
            if (track) {
                isVideoOff = !isVideoOff; track.enabled = !isVideoOff;
                toggleVideoBtn.classList.toggle('off', isVideoOff);
                localVideo.classList.toggle('hidden', isVideoOff);
                toggleVideoBtn.innerHTML = isVideoOff ? '<div class="icon-container">📹</div> Turn On' : '<div class="icon-container">📷</div> Video';
            }
        };

        endCallBtn.onclick = () => endCallAndDestroy("Call Ended.");

        function checkAndBurnRoom() {
            if (mediaConnected && dataConnected && !peer.disconnected) {
                setTimeout(() => { if (!peer.disconnected) peer.disconnect(); }, 1500);
            }
        }

        actionBtn.onclick = () => {
            if (joinRoomId) return;
            actionBtn.innerText = "Generating..."; actionBtn.disabled = true;

            const randomRoomId = 'room_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            peer = new Peer(randomRoomId, { config: rtcConfig });

            peer.on('open', (id) => {
                const inviteUrl = window.location.origin + window.location.pathname + '?room=' + id;
                actionBtn.style.display = 'none';
                document.getElementById('menu-desc').innerText = "Send this link. It permanently burns when they join.";
                
                linkBox.style.display = 'block'; linkBox.innerText = inviteUrl + "\n\n(Tap to Copy)";
                linkBox.onclick = () => { navigator.clipboard.writeText(inviteUrl); linkBox.style.color = "#fff"; linkBox.innerText = "✅ Link Copied!"; };
                statusHUD.innerText = "Waiting for connection..."; statusHUD.style.color = "#ffcc00";
            });

            peer.on('call', (call) => {
                call.answer(localStream); activeCall = call; mainOverlay.style.display = 'none';
                call.on('stream', (stream) => {
                    remoteVideo.srcObject = stream; statusHUD.style.opacity = '0';
                    mediaConnected = true;
                    checkAndBurnRoom();
                });
                call.on('close', () => endCallAndDestroy("The other person ended the call."));
            });

            peer.on('connection', setupDataConnection);
            peer.on('error', showError);
        };

        function startJoinerFlow() {
            mainOverlay.style.display = 'none'; 
            peer = new Peer(null, { config: rtcConfig });

            peer.on('open', () => {
                const call = peer.call(joinRoomId, localStream);
                if (!call) return showError();
                
                activeCall = call;
                call.on('stream', (stream) => {
                    remoteVideo.srcObject = stream; 
                    statusHUD.style.opacity = '0'; 
                    loadingScreen.style.display = 'none';
                    mediaConnected = true;
                    checkAndBurnRoom();
                });
                call.on('close', () => endCallAndDestroy("The other person ended the call."));
                
                setupDataConnection(peer.connect(joinRoomId));
            });
            peer.on('error', showError);
        }

        function setupDataConnection(conn) {
            dataConn = conn;
            dataConn.on('open', () => {
                dataConnected = true;
                checkAndBurnRoom();
            });
            dataConn.on('data', (data) => {
                if (data.type === 'chat') { 
                    appendMessage(data.text, 'remote'); 
                    if (!chatPopupOverlay.classList.contains('open')) chatBadge.style.display = 'block'; 
                }
            });
            dataConn.on('close', () => endCallAndDestroy("The other person ended the call."));
        }

        document.getElementById('sendBtn').onclick = () => {
            const text = chatInput.value.trim();
            if (!text || !dataConn || !dataConnected) return;
            dataConn.send({ type: 'chat', text: text });
            appendMessage(text, 'local'); chatInput.value = '';
        };

        function appendMessage(text, sender) {
            const bubble = document.createElement('div'); bubble.className = `chat-bubble ${sender}`;
            bubble.textContent = text; chatMessages.appendChild(bubble); chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatToggleBtn.onclick = () => { 
            chatPopupOverlay.classList.add('open'); 
            chatBadge.style.display = 'none'; 
            setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; }, 300);
        };

        closeChatBtn.onclick = () => chatPopupOverlay.classList.remove('open');
        chatPopupOverlay.onclick = (e) => { if (e.target === chatPopupOverlay) chatPopupOverlay.classList.remove('open'); };
        chatInput.addEventListener('focus', () => { setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; }, 300); });
        chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('sendBtn').click(); });

        function showError() { 
            shutOffHardware(); 
            window.location.replace("https://google.com"); 
        }

        function endCallAndDestroy(msg) {
            if (activeCall) activeCall.close(); if (dataConn) dataConn.close(); if (peer) peer.destroy();
            shutOffHardware();
            
            loadingScreen.innerHTML = `<div style="font-size:16px; color:#ff3b30; font-family:monospace;">${msg}<br><br>Ejecting from session...</div>`;
            loadingScreen.style.display = 'flex';
            
            setTimeout(() => window.location.replace("https://google.com"), 1500);
        }

        function shutOffHardware() { if (localStream) localStream.getTracks().forEach(t => t.stop()); }

        init();
    </script>
</body>
</html>
